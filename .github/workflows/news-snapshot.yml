name: Refresh news snapshot

# Rebuilds data/news-snapshot.json from public news RSS feeds every 6 hours
# so the agents always verify against recent coverage. The script only
# overwrites the snapshot when it collects at least one item, so a failed
# run keeps the previous snapshot in place.

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build news snapshot
        run: node scripts/build-news-snapshot.mjs

      - name: Commit snapshot if changed
        run: |
          git config user.name "evidence-desk-bot"
          git config user.email "evidence-desk-bot@users.noreply.github.com"
          git add data/news-snapshot.json
          if git diff --cached --quiet; then
            echo "Snapshot unchanged."
          else
            git commit -m "chore: refresh news snapshot"
            git push
          fi
